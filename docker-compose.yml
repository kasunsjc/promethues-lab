version: '3.8'

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}
  mysql_data: {}
  k6_data: {}
  alertmanager_data: {}
  loki_data: {}
  promtail_positions: {}

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--alertmanager.notification-queue-capacity=10000'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.advertise-address=0.0.0.0:9093'
    ports:
      - "9093:9093"
    networks:
      - monitoring

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sample_db
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: mysqlpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - monitoring

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=mysqluser:mysqlpassword@(mysql:3306)/
    volumes:
      - ./mysqld-exporter:/etc/mysqld-exporter
    command:
      - '--config.my-cnf=/etc/mysqld-exporter/config.cnf'
      - '--collect.info_schema.tables'
      - '--collect.info_schema.innodb_metrics'
      - '--collect.global_status'
      - '--collect.global_variables'
    depends_on:
      - mysql
    ports:
      - "9104:9104"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/mysql-dashboard.json:/var/lib/grafana/dashboards/mysql-dashboard.json
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - loki

  ubuntu:
    image: ubuntu:latest
    container_name: ubuntu
    restart: unless-stopped
    command: >
      bash -c "apt-get update &&
               apt-get install -y curl wget gnupg2 lsb-release &&
               wget -q -O - https://github.com/prometheus/node_exporter/releases/download/v1.6.1/node_exporter-1.6.1.linux-amd64.tar.gz | tar xzf - -C /tmp &&
               cp /tmp/node_exporter-1.6.1.linux-amd64/node_exporter /usr/local/bin/ &&
               /usr/local/bin/node_exporter"
    ports:
      - "9101:9100" # Node exporter (for monitoring)
    networks:
      - monitoring
    depends_on:
      - prometheus

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx-html:/usr/share/nginx/html
      - ./nginx-config:/etc/nginx/conf.d
    ports:
      - "8080:80"  # Nginx web server
    networks:
      - monitoring
    depends_on:
      - prometheus

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    command: -nginx.scrape-uri=http://nginx:80/stub_status
    ports:
      - "9113:9113"  # Nginx exporter metrics port
    networks:
      - monitoring
    depends_on:
      - nginx
      
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./k6-scripts:/scripts
      - k6_data:/data
    networks:
      - monitoring
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    depends_on:
      - nginx
      - influxdb
      
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    networks:
      - monitoring

  # ─── Loki: Log Aggregation ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - monitoring

  # ─── Promtail: Log Collector for Loki ────────────────────────────────
  # NOTE: The Docker socket grants root-equivalent access to the Docker host.
  # This is acceptable for a local lab environment; avoid in production.
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - promtail_positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # ─── OpenTelemetry Collector ─────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./config/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "8888:8888"    # OTel Collector metrics
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  # ─── BlackBox Exporter: Endpoint Probing ─────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./config/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    ports:
      - "9115:9115"
    networks:
      - monitoring

  # ─── Thanos Sidecar: StoreAPI view over local Prometheus TSDB ──────
  thanos-sidecar:
    image: thanosio/thanos:v0.41.0
    container_name: thanos-sidecar
    restart: unless-stopped
    command:
      - 'sidecar'
      - '--tsdb.path=/prometheus'
      - '--prometheus.url=http://prometheus:9090'
      - '--grpc-address=0.0.0.0:10901'
      - '--http-address=0.0.0.0:10902'
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "10901:10901"  # gRPC
      - "10902:10902"  # HTTP
    networks:
      - monitoring
    depends_on:
      - prometheus

  # ─── Thanos Query: HA Querying Layer ────────────────────────────────
  thanos-query:
    image: thanosio/thanos:v0.41.0
    container_name: thanos-query
    restart: unless-stopped
    command:
      - 'query'
      - '--http-address=0.0.0.0:9090'
      - '--grpc-address=0.0.0.0:10903'
      - '--endpoint=thanos-sidecar:10901'
      - '--query.replica-label=replica'
    ports:
      - "10904:9090"   # Thanos Query UI
    networks:
      - monitoring
    depends_on:
      - thanos-sidecar