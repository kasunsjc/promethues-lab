global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'prometheus-lab'
    replica: 'replica-1'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "alert_rules.yml"
  - "security_rules.yml"
  - "recording_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # File-based service discovery — primary target management
  # Targets: node-exporter, mysql-exporter, ubuntu, nginx-exporter
  # Edit config/file_sd/targets.json to add/remove targets (auto-reloads every 30s)
  - job_name: 'file-sd-targets'
    file_sd_configs:
      - files:
          - '/etc/prometheus/file_sd/*.json'
        refresh_interval: 30s
    relabel_configs:
      # The "job" label in Prometheus is fixed by job_name above.
      # Per-target grouping is expressed via the "service" label in targets.json.
      # This rule defensively renames any advisory "job" field in the JSON to "service"
      # so accidental job= labels don't shadow the Prometheus job label.
      - source_labels: [job]
        target_label: service

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # OTel Collector exported metrics (from OTLP pipeline)
  - job_name: 'otel-exported-metrics'
    static_configs:
      - targets: ['otel-collector:8889']

  # BlackBox Exporter - HTTP probes
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:80
          - http://grafana:3000
          - http://prometheus:9090
          - http://alertmanager:9093
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # BlackBox Exporter - TCP probes
  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - mysql:3306
          - loki:3100
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # BlackBox Exporter self metrics
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']
