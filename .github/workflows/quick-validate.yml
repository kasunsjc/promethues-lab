name: 🚀 Quick Validation

on:
  push:
    branches: [ "*" ]
  pull_request:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  quick-validate:
    name: ⚡ Quick Configuration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      
    - name: ✅ Validate Docker Compose
      run: |
        echo "🔍 Validating docker-compose.yml..."
        docker compose config --quiet
        echo "✅ Docker Compose is valid"
        
    - name: ✅ Validate Prometheus Config
      run: |
        echo "🔍 Validating Prometheus configuration..."
        docker run --rm \
          --entrypoint="" \
          -v "$(pwd)/config:/etc/prometheus:ro" \
          prom/prometheus:latest \
          promtool check config /etc/prometheus/prometheus.yml
        echo "✅ Prometheus config is valid"
        
    - name: ✅ Validate Alert Rules
      run: |
        echo "🔍 Validating alert rules..."
        docker run --rm \
          --entrypoint="" \
          -v "$(pwd)/config:/etc/prometheus:ro" \
          prom/prometheus:latest \
          promtool check rules /etc/prometheus/alert_rules.yml
        
        # Also validate security rules if they exist
        if [[ -f config/security_rules.yml ]]; then
          echo "🔍 Validating security rules..."
          docker run --rm \
            --entrypoint="" \
            -v "$(pwd)/config:/etc/prometheus:ro" \
            prom/prometheus:latest \
            promtool check rules /etc/prometheus/security_rules.yml
        fi
        echo "✅ Alert rules are valid"
        
    - name: ✅ Validate Alertmanager Config
      run: |
        echo "🔍 Validating Alertmanager configuration..."
        docker run --rm \
          --entrypoint="" \
          -v "$(pwd)/config:/etc/alertmanager:ro" \
          prom/alertmanager:latest \
          amtool check-config /etc/alertmanager/alertmanager.yml
        echo "✅ Alertmanager config is valid"
        
    - name: 🔧 Test Helper Scripts Syntax
      run: |
        echo "🔧 Testing shell script syntax..."
        # Test root entry-point scripts
        bash -n ./monitoring-helper.sh
        bash -n ./commands.sh
        # Test scripts in scripts/ directory
        bash -n ./scripts/alertmanager-helper.sh
        bash -n ./scripts/k6-load-test.sh
        bash -n ./scripts/import-k6-dashboard.sh
        bash -n ./scripts/security-monitoring.sh
        bash -n ./scripts/performance-analysis.sh
        bash -n ./scripts/test-network.sh
        bash -n ./scripts/validate-local.sh
        bash -n ./scripts/comprehensive-validation.sh
        echo "✅ All scripts have valid syntax"
        
    - name: 🐍 Test Python Script Syntax
      run: |
        echo "🐍 Testing Python script syntax..."
        python3 -m py_compile scripts/webhook_receiver.py
        echo "✅ Python script syntax is valid"

    - name: ✅ Validate New Config Files
      run: |
        echo "🔍 Validating additional configuration files..."

        # Validate Loki config YAML
        python3 -c "
        import yaml
        with open('config/loki-config.yml') as f:
            cfg = yaml.safe_load(f)
        assert 'server' in cfg, 'Missing server config'
        assert 'schema_config' in cfg, 'Missing schema_config'
        print('  ✅ loki-config.yml is valid YAML')
        "

        # Validate Promtail config YAML
        python3 -c "
        import yaml
        with open('config/promtail-config.yml') as f:
            cfg = yaml.safe_load(f)
        assert 'clients' in cfg, 'Missing clients config'
        assert 'scrape_configs' in cfg, 'Missing scrape_configs'
        print('  ✅ promtail-config.yml is valid YAML')
        "

        # Validate OTel Collector config YAML
        python3 -c "
        import yaml
        with open('config/otel-collector-config.yml') as f:
            cfg = yaml.safe_load(f)
        assert 'receivers' in cfg, 'Missing receivers'
        assert 'exporters' in cfg, 'Missing exporters'
        assert 'service' in cfg, 'Missing service'
        print('  ✅ otel-collector-config.yml is valid YAML')
        "

        # Validate BlackBox config YAML
        python3 -c "
        import yaml
        with open('config/blackbox.yml') as f:
            cfg = yaml.safe_load(f)
        assert 'modules' in cfg, 'Missing modules'
        print('  ✅ blackbox.yml is valid YAML')
        "

        # Validate file_sd targets JSON
        python3 -c "
        import json
        with open('config/file_sd/targets.json') as f:
            targets = json.load(f)
        assert isinstance(targets, list), 'Must be a JSON array'
        for entry in targets:
            assert 'targets' in entry and 'labels' in entry
        print(f'  ✅ targets.json is valid ({len(targets)} target groups)')
        "

        echo "✅ All additional configs validated"
